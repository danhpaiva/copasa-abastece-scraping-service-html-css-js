name: Update Alerts

on:
  schedule:
    - cron: '0 * * * *'   # toda hora
  workflow_dispatch:        # disparo manual
  push:
    branches: [main]
    paths-ignore:           # evita loop quando o bot commita alerts.json
      - 'alerts.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # CI — valida os arquivos estáticos do frontend
  # ─────────────────────────────────────────────
  ci:
    name: CI — Validar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          for f in index.html style.css app.js alerts.json bairros.json; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo obrigatório ausente: $f"
              exit 1
            fi
          done
          echo "Todos os arquivos obrigatórios presentes."

      - name: Validar JSON (alerts.json e bairros.json)
        run: |
          python -c "
          import json, sys
          for path in ['alerts.json', 'bairros.json']:
              try:
                  data = json.load(open(path))
                  print(f'OK: {path}')
              except Exception as e:
                  print(f'ERRO em {path}: {e}')
                  sys.exit(1)
          "

      - name: Verificar referências de assets no HTML
        run: |
          python -c "
          import re, sys
          html = open('index.html').read()
          for asset in ['style.css', 'app.js']:
              if asset not in html:
                  print(f'ERRO: {asset} nao referenciado no index.html')
                  sys.exit(1)
          print('Referencias de assets OK.')
          "

  # ─────────────────────────────────────────────
  # Scrape — coleta dados e commita alerts.json
  # ─────────────────────────────────────────────
  scrape:
    name: Scrape — Coletar alertas
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do scraper
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium --with-deps

      - name: Baixar scraper.py
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/danhpaiva/copasa-abastece-scraping-service-py/main/scraper.py" \
            -o scraper.py

      - name: Executar scraper
        run: |
          set +e
          python scraper.py --output /tmp/alerts_raw.json
          code=$?
          set -e
          # 0 = sem alertas, 1 = alertas encontrados — ambos são sucesso
          test $code -le 1

      - name: Empacotar resultado com timestamp
        run: |
          python - <<'EOF'
          import json, datetime, pathlib

          raw = json.loads(pathlib.Path("/tmp/alerts_raw.json").read_text())

          if isinstance(raw, list):
              alertas = raw
          else:
              alertas = raw.get("alertas", raw)

          output = {
              "gerado_em": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S"),
              "alertas": alertas,
          }
          pathlib.Path("alerts.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2)
          )
          print(f"alerts.json gerado com {len(alertas)} alerta(s).")
          EOF

      - name: Commitar alerts.json (apenas se houver mudança)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts.json
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: atualiza alerts.json [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────
  # CD — publica no GitHub Pages
  # ─────────────────────────────────────────────
  deploy:
    name: CD — Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: scrape
    # Só deploya se o scrape rodou com sucesso (changed pode ser true ou false —
    # ambos indicam execução bem-sucedida; na primeira vez também precisa publicar)
    if: ${{ always() && needs.scrape.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (garante commit mais recente, incluindo alerts.json)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
