name: Update Alerts

on:
  schedule:
    # 9-23/2 significa: começando às 09:07 UTC (06:07 local)
    # até às 23:07 UTC (20:07 local), a cada 2 horas.
    - cron: "7 9-23/2 * * *"
  workflow_dispatch: # disparo manual
  push:
    branches: [main]
    paths-ignore: # evita loop quando o bot commita alerts.json
      - "alerts.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # CI — valida os arquivos estáticos do frontend
  # ─────────────────────────────────────────────
  ci:
    name: CI — Validar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          for f in index.html sw.js manifest.json alerts.json bairros.json assets/style.css assets/app.js assets/icon.svg; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo obrigatório ausente: $f"
              exit 1
            fi
          done
          echo "Todos os arquivos obrigatórios presentes."

      - name: Validar JSON (alerts.json e bairros.json)
        run: |
          python -c "
          import json, sys
          for path in ['alerts.json', 'bairros.json']:
              try:
                  data = json.load(open(path))
                  print(f'OK: {path}')
              except Exception as e:
                  print(f'ERRO em {path}: {e}')
                  sys.exit(1)
          "

      - name: Verificar referências de assets no HTML
        run: |
          python -c "
          import re, sys
          html = open('index.html').read()
          for asset in ['assets/style.css', 'assets/app.js']:
              if asset not in html:
                  print(f'ERRO: {asset} nao referenciado no index.html')
                  sys.exit(1)
          print('Referencias de assets OK.')
          "

  # ─────────────────────────────────────────────
  # Scrape — coleta dados e commita alerts.json
  # ─────────────────────────────────────────────
  scrape:
    name: Scrape — Coletar alertas
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do scraper
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium --with-deps

      - name: Baixar scraper
        run: |
          git clone --depth=1 \
            https://github.com/danhpaiva/copasa-abastece-scraping-service-py.git \
            scraper_repo
          cp scraper_repo/scraper.py .
          cp -r scraper_repo/scraper ./scraper

      - name: Executar scraper
        run: |
          set +e
          python scraper.py --json --output /tmp/alerts_raw.json
          code=$?
          set -e
          # 0 = sem alertas, 1 = alertas encontrados — ambos são sucesso
          test $code -le 1

      - name: Empacotar resultado com timestamp e atualizar build-info no HTML
        run: |
          python - <<'EOF'
          import json, datetime, pathlib, re

          now = datetime.datetime.now(datetime.timezone.utc)
          ts  = now.strftime("%Y-%m-%dT%H:%M:%S")

          raw = json.loads(pathlib.Path("/tmp/alerts_raw.json").read_text())
          alertas = raw if isinstance(raw, list) else raw.get("alertas", raw)

          # Proteção contra falso-zero: não sobrescreve se o scraper retornou 0 alertas
          # mas o arquivo anterior tinha alertas ativos (possível instabilidade do site da Copasa)
          alerts_path = pathlib.Path("alerts.json")
          skip_alerts = False
          if len(alertas) == 0 and alerts_path.exists():
              try:
                  anterior = json.loads(alerts_path.read_text())
                  alertas_ant = anterior.get("alertas", []) if isinstance(anterior, dict) else anterior
                  ativos_ant = [a for a in alertas_ant if a.get("esta_ativa")]
                  if ativos_ant:
                      print(f"⚠ PROTEÇÃO: scraper retornou 0 alertas mas havia {len(ativos_ant)} ativo(s). alerts.json preservado.")
                      skip_alerts = True
              except Exception as e:
                  print(f"Aviso: não foi possível ler alerts.json anterior: {e}")

          if not skip_alerts:
              output = {"gerado_em": ts, "alertas": alertas}
              alerts_path.write_text(json.dumps(output, ensure_ascii=False, indent=2))
              print(f"alerts.json gerado com {len(alertas)} alerta(s).")
          else:
              print("alerts.json mantido sem alteração (proteção contra falso-zero).")

          # Injeta timestamp de deploy no footer do index.html (horário de Brasília, UTC-3)
          brt = datetime.timezone(datetime.timedelta(hours=-3))
          now_brt = now.astimezone(brt)
          html_path = pathlib.Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          build_str = f"Deploy: {now_brt.strftime('%d/%m/%Y às %H:%M')} (horário de Brasília)"
          html = re.sub(r'<!-- BUILD_TIME -->', build_str, html)
          html = re.sub(r'Deploy: .+?\(horário de Brasília\)', build_str, html)
          html_path.write_text(html, encoding="utf-8")
          print(f"index.html atualizado com build-info: {build_str}")

          # Atualiza versão do cache do Service Worker (força bust em cada deploy)
          sw_path = pathlib.Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw_ver = now.strftime("%Y%m%d%H%M")
          sw = re.sub(r"copasa-[^'\"]+", f"copasa-{sw_ver}", sw)
          sw_path.write_text(sw, encoding="utf-8")
          print(f"sw.js atualizado com cache version: copasa-{sw_ver}")
          EOF

      - name: Commitar alerts.json (apenas se houver mudança)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts.json index.html sw.js
          if git diff --cached --quiet; then
            echo "Sem mudanças — nada a commitar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: atualiza alerts.json e build-info [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push falhou, tentativa $i/3. Aguardando..."
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────
  # CD — publica no GitHub Pages
  # ─────────────────────────────────────────────
  deploy:
    name: CD — Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: scrape
    # Só deploya se o scrape rodou com sucesso (changed pode ser true ou false —
    # ambos indicam execução bem-sucedida; na primeira vez também precisa publicar)
    if: ${{ always() && needs.scrape.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (garante commit mais recente, incluindo alerts.json)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
