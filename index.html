<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Monitor de interrupções no abastecimento de água da Copasa para bairros monitorados." />
  <title>Copasa Abastece — Monitor de Interrupções</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>" />
</head>
<body>

  <header>
    <h1>💧 Copasa Abastece — Monitor</h1>
    <p>Acompanhe interrupções no abastecimento de água para os bairros monitorados</p>
  </header>

  <main>

    <div id="status-banner" class="status-banner loading" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span id="status-text">Carregando dados…</span>
    </div>

    <div class="meta-bar">
      <span>Última atualização: <strong id="last-updated">–</strong></span>
      <button id="btn-refresh" class="btn-refresh" aria-label="Atualizar dados agora">
        <span class="btn-refresh-icon">↻</span> Atualizar agora
      </button>
    </div>

    <section id="cards-container" aria-label="Lista de alertas de abastecimento">
      <!-- Cards injetados por app.js -->
    </section>

  </main>

  <footer>
    Dados obtidos via
    <a href="https://copasaabastece.com.br" target="_blank" rel="noopener">copasaabastece.com.br</a>
    · Atualizado automaticamente a cada hora pelo GitHub Actions ·
    <a href="https://github.com/danhpaiva/copasa-abastece-scraping-service-html-css-js" target="_blank" rel="noopener">Código-fonte</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
